    <div class="hdr"><button class="pill" id="profBtn" aria-label="Switch profile"></button><button class="pill ic" id="colBtn" aria-label="Change colour"></button><button class="pill ic" id="modeBtn" aria-label="Switch between light and dark"></button></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
'use strict';
var KEY='steady.v1';
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function dayIdx(){return Math.floor((Date.now()+19800000)/864e5)}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2600)}
/* ---------- data (saved on this device) ---------- */
var S={profile:null,target:'',sessions:[],days:[],mode:'auto',remind:null,lang:'en-IN',vocab:[],fixes:{},guest:false,resume:null};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device.')}cloudSave()}
/* ---------- account and cloud saving (Firebase) ---------- */
var firebaseConfig={apiKey:"AIzaSyDpvS27o9i8NHYbCGB-YuLEyhDYa94bVdQ",authDomain:"studyprephub.firebaseapp.com",projectId:"studyprephub",storageBucket:"studyprephub.firebasestorage.app",messagingSenderId:"578977296879",appId:"1:578977296879:web:44eebdb0623f0e533a461a"};
var FB={ok:false,ready:false,user:null,auth:null,db:null,timer:null,saving:false,again:false,loaded:false,status:''};
var CLOUD_KEYS=['profile','target','sessions','days','mode','remind','lang','vocab','fixes','alsoRec','resume','theme','resumeAsked','bannerOff','resumeAskDay','resumeNever','targetRole','roles','plan','planDone','added','crack','research','me','mocks','talks','jobM'];
function gate(){return FB.ok&&(!FB.ready||(!FB.user&&!S.guest))}
function cloudRef(){return FB.db.doc('users/'+FB.user.uid+'/data/app')}
function cloudSave(){
  if(!FB.ok||!FB.user||!FB.loaded)return;
  clearTimeout(FB.timer);FB.timer=setTimeout(cloudFlush,1500);
}
function cloudFlush(){
  if(!FB.ok||!FB.user||!FB.loaded)return;
  if(FB.saving){FB.again=true;return}
  FB.saving=true;FB.again=false;FB.status='saving';
  var o={updatedAt:Date.now()};CLOUD_KEYS.forEach(function(k){if(S[k]!==undefined)o[k]=S[k]});
  o=JSON.parse(JSON.stringify(o));o.sessions=(o.sessions||[]).slice(0,100);o.days=(o.days||[]).slice(-200);
  cloudRef().set(o).then(function(){FB.status='saved'}).catch(function(e){FB.status='error'}).then(function(){FB.saving=false;if(FB.again)cloudFlush();});
}
function softRefresh(){var m=$('#main');if(m&&V.tab==='progress'&&!V.view&&!V.onb)render()}
function mergeCloud(d){
  CLOUD_KEYS.forEach(function(k){if(d[k]===undefined)return;
    if(k==='sessions'){var seen={},all=(d.sessions||[]).concat(S.sessions||[]).filter(function(s){if(seen[s.id])return false;seen[s.id]=1;return true});all.sort(function(a,b){return b.id-a.id});S.sessions=all.slice(0,200)}
    else if(k==='days'){var u={};(d.days||[]).concat(S.days||[]).forEach(function(x){u[x]=1});S.days=Object.keys(u).map(Number).sort(function(a,b){return a-b})}
    else if(k==='fixes'){var f={};for(var a in (S.fixes||{}))f[a]=S.fixes[a];for(var b in d.fixes)f[b]=d.fixes[b];S.fixes=f}
    else if(k==='vocab'){var v={};(d.vocab||[]).concat(S.vocab||[]).forEach(function(x){v[x]=1});S.vocab=Object.keys(v).slice(0,60)}
    else S[k]=d[k];
  });
}
function loadCloud(){
  FB.loaded=false;
  cloudRef().get().then(function(snap){
    if(snap.exists)mergeCloud(snap.data());
    FB.loaded=true;S.guest=false;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    cloudFlush();render();
  }).catch(function(){FB.status='error';FB.loaded=false;toast('Could not reach your account. Working on this device for now.');render()});
}
function initFirebase(){
  if(!window.firebase){FB.status='offline';return}
  try{
    firebase.initializeApp(firebaseConfig);FB.auth=firebase.auth();FB.db=firebase.firestore();FB.ok=true;
    FB.auth.getRedirectResult().catch(function(e){if(e&&e.code!=='auth/no-auth-event')toast('Sign-in did not finish. Please try again.')});
    FB.auth.onAuthStateChanged(function(u){FB.user=u;FB.ready=true;V.signing=false;if(u)loadCloud();else{FB.loaded=false;render()}});
  }catch(e){FB.ok=false;FB.status='error'}
  setTimeout(function(){if(FB.ok&&!FB.ready){FB.ready=true;render()}},6000);
}
function signIn(){
  if(!FB.ok){toast('Sign-in is not available right now.');return}
  if(V.signing)return;
  V.signing=true;if(gate())render();
  var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  function stop(){V.signing=false;render()}
  FB.auth.signInWithPopup(p).then(function(){V.signing=false}).catch(function(e){
    var c=e&&e.code;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){FB.auth.signInWithRedirect(p);return}
    stop();
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
    toast(c==='auth/unauthorized-domain'?'This web address is not allowed in Firebase yet.':c==='auth/network-request-failed'?'No internet connection. Try again.':'Could not sign in. Please try again.');
  });
}
function signOutNow(){
  if(!FB.ok)return;
  try{clearTimeout(FB.timer)}catch(e){}
  FB.auth.signOut().then(function(){try{localStorage.removeItem(KEY)}catch(e){}S={profile:null,target:'',sessions:[],days:[],mode:S.mode,remind:null,lang:'en-IN',vocab:[],fixes:{},guest:false};FB.loaded=false;V.onb=false;V.view=null;V.tab='today';render()});

  var l=text.toLowerCase(),w=wc(text),kws=(q.q||'').toLowerCase().replace(/[^a-z ]/g,' ').split(' ').filter(function(x){return x.length>4}).slice(0,8),
    kw=kws.filter(function(k){return l.indexOf(k.slice(0,5))>=0}).length,nums=(text.match(/\d+/g)||[]).length,marks=(l.match(/\b(first|then|next|finally|because|result|option|risk|instead|therefore|for example)\b/g)||[]).length,fill=(text.match(FILL)||[]).length;
  var sc={relevance:Math.min(90,35+kw*14+(w>25?10:0)),structure:Math.min(90,30+marks*13+(w>45?12:0)),evidence:Math.min(90,28+nums*18+(/for example|once|last year/.test(l)?14:0)),role_knowledge:Math.min(85,35+Math.min(4,Math.floor(w/20))*8),communication:Math.max(20,Math.min(92,84-fill*9-(w<20?35:w<35?15:0)))};
  if(w<8){sc.relevance=Math.min(sc.relevance,25);sc.structure=Math.min(sc.structure,20)}
  var t=0;[['relevance',25],['structure',20],['evidence',20],['role_knowledge',25],['communication',10]].forEach(function(x){t+=sc[x[0]]*x[1]/100});
  return {total:Math.round(t),scores:sc,basic:true,worked:'Basic check only (the AI is not available right now).',improve:[sc.evidence<60?'Add one real example with a number.':'',sc.structure<60?'Use an order: first, then, finally.':'',sc.relevance<60?'Answer the question in your first sentence.':''].filter(Boolean),missing:[],suggested:''};
}
var MK_FIX={relevance:'Answer the question in your first sentence, then add detail.',structure:'Use an order: situation, what I did, result. Say first, then, finally.',evidence:'Add one real example and one number (percent, days, people, cost).',role_knowledge:'Use the words and steps this role is tested on. Study the topic in Plan.',communication:'Aim for 60 to 90 seconds, short sentences, fewer filler words.'};
var MK_NAMES={relevance:'Relevance',structure:'Structure',evidence:'Evidence',role_knowledge:'Role knowledge',communication:'Communication'};
var MK_W={relevance:25,structure:20,evidence:20,role_knowledge:25,communication:10};

function mockQuestions(n){
  var role=S.targetRole||'',out=[{q:'Tell me about yourself.',type:'Introduction',intro:true}],pool=[],seen={},rd=rData(role),f=fam(role);
  var recent={};(S.mocks||[]).slice(0,3).forEach(function(m){(m.qs||[]).forEach(function(x){recent[(x.q||'').toLowerCase()]=1})});
  function add(q,type,tip){var k=(q||'').toLowerCase();if(!q||seen[k]||/about yourself/.test(k))return;seen[k]=1;pool.push({q:q,type:type||'Role',tip:tip||''})}
  if(rd)(rd.questions||[]).forEach(function(x){add(x.q,x.round,x.tip)});
  qlist(f).forEach(function(x){add(x[1],x[0]==='Practice'?'Role':x[0],x[2])});
  GENERAL_JOB.forEach(function(g){add(g.q,'General')});
  var fresh=pool.filter(function(x){return !recent[x.q.toLowerCase()]});if(fresh.length>=n-1)pool=fresh;
  var off=((S.mocks||[]).length*2)%Math.max(1,pool.length),rot=pool.slice(off).concat(pool.slice(0,off));

}
function mkTopics(){var f=fam(S.targetRole||''),a=[];f.groups.forEach(function(g){g[1].forEach(function(t){a.push(t[0])})});return a.slice(0,8)}
function probeRule(q,text){
  var l=text.toLowerCase(),w=wc(text);
  if(q.type==='Behavioural'&&!/\d/.test(text))return 'What was the measurable result, and how did you know it worked?';
  if(w<30)return 'Can you walk me through the first three steps you would take, in order?';
  if(!/\d/.test(text)&&!/metric|measure|baseline/.test(l))return 'What number or measure would tell you this worked?';
  if(!/risk|trade-?off|mitigat|escalat/.test(l)&&q.type!=='Introduction')return 'What is the biggest risk here, and how would you handle it?';
  return null;
}
function outlineFor(q){

  var t=q.type||'';return /behav/i.test(t)?['Situation: one real example, two lines','What you did (your actions, not the team\'s)','The result with a number','What you learned']:/scenario|technical|case|ai/i.test(t)?['Clarify the goal and the limits first','Give 3 steps in order','Name the biggest risk and how you would handle it','Say how you would measure success']:['Give your answer or decision rule first','Support it with one real example','Mention the trade-off','Close with the result you want'];
}

  h+='<div class="card"><label>Topic</label><div class="row wrap">'+TK_TOPICS.map(function(x){return '<button class="chip'+(t.topic===x?' on':'')+'" data-tkt="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div><label for="tkCustom">Or your own topic</label><input id="tkCustom" maxlength="120" value="'+esc(t.custom)+'" placeholder="For example: why our team should adopt Jira"></div>';
  if(!t.fb){
    h+='<div class="card"><div style="text-align:center">'+meterSvg(0,200)+meterLegend()+'</div></div>';
    h+=recorderCard(t,'tk','Your talk (voice)');
    h+='<button class="btn big" data-act="tkSubmit" style="min-height:54px;font-size:17px"'+((t.tr&&wc(t.tr)>=8&&!t.rec&&!t.busy)?'':' disabled')+'>Get feedback</button>';
    if(t.loading)h+='<div class="card" style="text-align:center"><div class="spin"></div><b>Listening to your talk…</b></div>';
    return h;
  }
  var f=t.fb;
  h+='<div class="card"><b>Your feedback meter</b>'+meterSvg(f.total)+meterLegend()+'<div class="note">'+(f.total>=75?'Green. Clear and confident.':f.total>=55?'Amber. Good start, tighten it.':'Red. Needs a clearer structure.')+(f.basic?' (Basic feedback. The AI was not available.)':'')+'</div></div>';

  h+='<div class="card" style="border-color:var(--accent)"><h2>How to improve</h2>'+f.tips.map(function(x,i){return '<div class="small"><b>'+(i+1)+'.</b> '+esc(x)+'</div>'}).join('')+'</div>';
  if(f.better)h+='<div class="card"><h2>A tighter version</h2><div class="soft">'+esc(f.better)+'</div><button class="btn quiet" data-act="tkHear">🔊 Listen</button></div>';
  if(t.hist.length>1)h+='<div class="card"><b>This session</b>'+t.hist.map(function(x,i){return '<div class="row between small"><span>Take '+(i+1)+'</span><b class="mpill '+mCls(x)+'">'+x+'</b></div>'}).join('')+'</div>';
  return h+'<button class="btn big" data-act="tkAgain" style="min-height:54px;font-size:17px">Try again</button>';

function tkAct(a){
  var t=V.tk;
  if(a==='tkMic'){recToggle('tk');return true}
  if(a==='tkPlay'){if(RC.url){try{new Audio(RC.url).play()}catch(e){}}return true}
  if(a==='tkRedo'){t.blob=null;t.tr='';t.err='';render();return true}
  if(a==='tkDict'){dictToggle('tkTr');return true}
  if(a==='tkAgain'){t.fb=null;t.tr='';t.blob=null;t.secs=0;t.err='';render();return true}
  if(a==='tkHear'){say(t.fb.better);return true}
  if(a==='tkSubmit'){
    var ta=$('#tkTr'),text=((ta&&ta.value)||t.tr||'').trim();if(wc(text)<8){toast('Say a little more first.');return true}
    t.loading=true;render();var d=delivery(text,t.secs),topic=(t.custom||'').trim()||t.topic;
    var done=function(f){t.loading=false;f.words=d.words;f.secs=d.secs;f.nfill=d.fillers;t.fb=f;t.hist.push(f.total);S.talks.unshift({at:Date.now(),topic:topic,score:f.total});S.talks=S.talks.slice(0,30);save();render();$('#main').scrollTop=0};
    workerCall('/talk/score',{topic:topic,text:text,profile:{name:S.me.name,role:S.me.role,company:S.me.company,target:S.targetRole},delivery:d},60000).then(done,function(e){
      var b=basicScore({q:topic},text,d.secs),w=d.secs>=10?d.words/(d.secs/60):0,fl=d.secs>=10?d.fillers/(d.secs/60):0;
      done({total:b.total,clarity:b.scores.relevance,structure:b.scores.structure,confidence:b.scores.communication,pace:w?(w>=110&&w<=160?100:w>=90&&w<=180?75:50):70,fillers:fl?(fl<3?100:fl<6?75:45):70,wpm:Math.round(w),tips:b.improve.length?b.improve:['Keep this structure and practise once more.'],better:'',basic:true})});
    return true}
  return false;
}

  h+='<button class="btn big" data-act="yoMock" style="min-height:54px;font-size:17px"'+(meReady()?'':' disabled')+'>Build my mock interview</button>';

function jmPart(w){var s=vJobM(),i=s.indexOf('<div class="card"><div class="row between"><b>Your new resume</b>');return w==='a'?(i>0?s.slice(0,i):s):(i>0?s.slice(i):'')}
async function dlPdf(r,role){
  await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
  var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),txt=resumeText(r),lines=doc.splitTextToSize(txt,500),y=50,i;
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);
  for(i=0;i<lines.length;i++){if(y>790){doc.addPage();y=50}doc.text(lines[i],48,y);y+=14}
  doc.save(((r.name||'Resume').replace(/[^\w \-]+/g,'').trim()+' - '+(role||'Resume').replace(/[^\w \-]+/g,'').trim()).slice(0,80)+'.pdf');
}
function dlTxt(r,role){var b=new Blob([resumeText(r)],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=((r.name||'Resume')+' - '+(role||'Resume')).replace(/[^\w \-]+/g,'').slice(0,80)+'.txt';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000)}

function yoAct(a){
  if(a==='yoAnalyse'||a==='yoDraft'){V.jm.role=S.targetRole;V.jm.jd='';var key=jobKey(S.targetRole,'',S.resume?S.resume.text:'');if(S.jobM&&S.jobM.key===key&&a==='yoDraft'){toast('Your draft is ready below.');return true}runJob('m',a==='yoAnalyse'&&!!S.jobM&&S.jobM.key===key);return true}
  if(a==='yoMock'){if(!meReady()){toast('Finish items 1 to 4 first.');return true}V.tab='mock';V.mk=V.mk&&V.mk.step==='run'?V.mk:mkFresh();render();$('#main').scrollTop=0;return true}
  if(a==='yoFreshAsk'){V.confirmFresh=true;render();return true}
  if(a==='yoFreshNo'){V.confirmFresh=false;render();return true}
  if(a==='yoFresh'){yoFreshDo();return true}
  if(a==='dlPdf'){if(S.jobM)dlPdf(S.jobM.resume,S.jobM.role).catch(function(){toast('Could not make the PDF. Use Word or Copy text.')});return true}
  if(a==='dlTxt'){if(S.jobM)dlTxt(S.jobM.resume,S.jobM.role);return true}
  return false;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Steady</title>
<style>
/* Layout: one phone-width column, bottom tabs, one primary action per screen. Step 1: voice practice, saved on this device. */
:root{--bg:#F3F5F7;--surface:#FFFFFF;--ink:#13232B;--muted:#5B6B73;--line:#D8E0E1;--accent:#0F5E63;--accent-ink:#FFFFFF;--soft:#E3F0F0;--win:#B07508;--win-soft:#FBEFD5;--warn:#B4441A;--warn-soft:#FBE6DC;--good:#17803D;--good-soft:#DDF3E4;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0D171B;--surface:#16252B;--ink:#E7F0F0;--muted:#97A9AF;--line:#27393F;--accent:#5BB5B5;--accent-ink:#062022;--soft:#173538;--win:#F0B44C;--win-soft:#3A2E14;--warn:#F08A5D;--warn-soft:#3B2217;--good:#58C77F;--good-soft:#163524}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0D171B;--surface:#16252B;--ink:#E7F0F0;--muted:#97A9AF;--line:#27393F;--accent:#5BB5B5;--accent-ink:#062022;--soft:#173538;--win:#F0B44C;--win-soft:#3A2E14;--warn:#F08A5D;--warn-soft:#3B2217;--good:#58C77F;--good-soft:#163524}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}p{margin:0}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.hdr{display:flex;gap:8px;align-items:center}
main{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.quiet{background:var(--soft);color:var(--accent)}.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.block{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:20px;min-height:68px;border-radius:18px}.btn.rec{background:var(--warn);color:#fff}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--accent);border:0}
button.pill{cursor:pointer;padding:7px 12px;font-size:13px}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.win{background:var(--win-soft);color:var(--win)}
.ic{padding:8px 10px}
#profBtn{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label{font-weight:700;font-size:13px;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px}textarea{resize:vertical}
.scn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;width:100%}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800}
.dot.on{background:var(--good);border-color:var(--good);color:#fff}
.box{min-height:110px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;font-size:18px;line-height:1.5;overflow-wrap:anywhere}
.box i{color:var(--muted);font-style:normal}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.meter div{height:100%;width:0;background:var(--accent);transition:width .08s}
.hint{background:var(--win-soft);border-left:4px solid var(--win);border-radius:12px;padding:10px 12px;font-size:14px}
.msg{border-radius:12px;padding:10px 12px;font-size:14px}.msg.no{background:var(--warn-soft);color:var(--warn)}.msg.ok{background:var(--good-soft);color:var(--good)}.msg.wait{background:var(--win-soft);color:var(--win)}
audio{width:100%}
.entry{padding:10px 0;border-top:1px solid var(--line)}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
.big-n{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;display:none;max-width:90%;text-align:center}
.toast.on{display:block}

/* Wider screens only. The phone layout above is unchanged. */
.wide{}
@media (min-width:700px){
  .app{max-width:860px}
  main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start;padding:16px 24px 28px}
  main>div:not(.card),main>button.btn,main>.wide{grid-column:1/-1}
  main>button.btn{justify-self:start}
  .stepgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .stepgrid .step{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
}
@media (min-width:1000px){
  html,body{background:var(--bg)}
  .app{max-width:none;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "nav main"}
  .app.nonav{grid-template-columns:1fr;grid-template-areas:"head" "main"}
  header{grid-area:head;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
  nav{grid-area:nav;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 12px;gap:4px;align-self:stretch}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px}
  nav button svg{width:20px;height:20px}
  nav button[aria-current="page"]{background:var(--soft)}
  nav button:hover{background:var(--soft)}
  main{grid-area:main;padding:24px 36px 40px;gap:18px}
  main>*{max-width:none}
  .inner{max-width:1180px}
  .toast{bottom:24px}
  .btn.big{max-width:420px}
}
@media (min-width:1500px){
  main{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stepgrid{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 14h3l3-8 4 12 3-7h3"/></svg></span>Steady</div>
    <div class="hdr"><button class="pill" id="profBtn" aria-label="Switch profile"></button><button class="pill ic" id="modeBtn" aria-label="Switch between light and dark"></button></div>
  </header>
  <main id="main"></main>
  <nav id="tabs" aria-label="Main"></nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
var KEY='steady.v1';
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function dayIdx(){return Math.floor((Date.now()+19800000)/864e5)}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2600)}
/* ---------- data (saved on this device) ---------- */
var S={profile:null,target:'',sessions:[],days:[],mode:'auto',remind:null,lang:'en-IN'};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device.')}}
var V={tab:'today',view:null,pt:null,pg:null,pspec:'',pgs:'',onb:false,prompt:null,res:null,typed:false};
/* ---------- profiles and practice prompts ---------- */
var PROFILES={
 student:{label:'Student',blurb:'School or college, interviews, presentations',goals:['Interviews','Class presentations','Speaking up in class','Group projects']},
 professional:{label:'Professional',blurb:'Employee, manager or specialist',goals:['Promotion','Meetings and updates','Clients and stakeholders','Giving feedback']},
 business:{label:'Business professional',blurb:'Owner, founder, sales or consultant',goals:['Sales and prospects','Negotiation','Investors and pitching','Handling clients']},
 other:{label:'Other',blurb:'Freelancer, job seeker, homemaker, anything else',goals:['Interviews','Everyday conversations','Public speaking','Confidence']}
};
var TMAY={id:'tmay',q:'Tell me about yourself.',hint:'Present, past, future: who you are now, one or two achievements, and why this role. Aim for about 60 seconds.',target:60,star:true};
var STARTERS={
 student:[{id:'s1',q:'Why did you choose your course, and what do you enjoy most about it?'},{id:'s2',q:'Describe a project you are proud of. What was your part and what was the result?'},{id:'s3',q:'Tell me about a time you worked in a team and something went wrong.'}],
 professional:[{id:'p1',q:'Walk me through your current role and the biggest result you delivered this year.'},{id:'p2',q:'Describe a project you delivered. What was the goal, what did you do, and what changed?'},{id:'p3',q:'Tell me about a time you disagreed with a stakeholder. How did you handle it?'}],
 business:[{id:'b1',q:'Pitch your business or product in 30 seconds.'},{id:'b2',q:'A client says your price is too high. Respond to them.'},{id:'b3',q:'A customer is upset about a missed deadline. What do you say?'}],
 other:[{id:'o1',q:'What kind of work are you looking for, and why does it suit you?'},{id:'o2',q:'Describe something you are proud of and what it shows about you.'},{id:'o3',q:'Tell me about a time you solved a problem under pressure.'}]
};
function ptype(){return V.pt&&V.onb?V.pt:(S.profile?S.profile.type:'professional')}
function label(){var p=S.profile;return p?(p.type==='other'&&p.spec?p.spec:PROFILES[p.type].label):'Who are you?'}
function todayStarter(){var a=STARTERS[S.profile?S.profile.type:'professional'];return a[dayIdx()%a.length]}
/* ---------- look ---------- */
var SUN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
function isDark(){var a=document.documentElement.getAttribute('data-theme');if(a)return a==='dark';return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyLook(){var r=document.documentElement;if(S.mode==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.mode);$('#modeBtn').innerHTML=isDark()?SUN:MOON}
/* ---------- speech analysis ---------- */
var FILL=/\b(um+|uh+|erm|like|basically|actually|you know|sort of|kind of|literally)\b/gi;
function analyse(text,secs,stamps){
  var words=(text.match(/\S+/g)||[]).length,fill=text.match(FILL)||[],gaps=[];
  for(var i=1;i<stamps.length;i++)gaps.push(stamps[i]-stamps[i-1]);
  return {words:words,secs:Math.round(secs),wpm:secs>=8?Math.round(words/(secs/60)):0,fill:fill.map(function(x){return x.toLowerCase()}),fillRate:words?fill.length/words*100:0,longest:gaps.length?Math.max.apply(null,gaps)/1000:0,longPauses:gaps.filter(function(g){return g>2500}).length};
}
function tips(a,target){
  var t=[];
  if(a.words<15)t.push(['warn','Very short answer. Add one example with a result.']);
  else{
    if(a.wpm){if(a.wpm<110)t.push(['warn','A little slow ('+a.wpm+' words a minute). Aim for 130 to 160.']);else if(a.wpm>170)t.push(['warn','Fast ('+a.wpm+' words a minute). Slow down and pause between points.']);else t.push(['good','Good pace ('+a.wpm+' words a minute).'])}
    if(a.fillRate>4)t.push(['warn','Many filler words ('+a.fill.length+'). Pause silently instead of saying them.']);else if(a.fill.length<=1)t.push(['good','Very few filler words.']);else t.push(['win','A few filler words ('+a.fill.length+'). Replace each with a short pause.']);
    if(target){if(a.secs<target*0.6)t.push(['warn','Shorter than the '+target+' second target. Add an achievement with a number.']);else if(a.secs>target*1.5)t.push(['warn','Longer than the '+target+' second target. Cut the least important point.']);else t.push(['good','Good length for a '+target+' second answer.'])}
    if(a.longPauses>2)t.push(['win','Several long gaps. Practise the move from one point to the next.']);
  }
  return t;
}
/* ---------- voice recording ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function isMobile(){return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'')}
function alsoRec(){return S.alsoRec!==undefined?S.alsoRec:!isMobile()}
var T={on:false,final:'',interim:'',start:0,stamps:[],err:'',stop:false,sr:null,mr:null,chunks:[],stream:null,stopMeter:null,mime:''};
function explain(c){return ({'not-allowed':'The microphone is blocked. Tap the lock icon next to the web address, open Permissions, set Microphone to Allow, then reload.','service-not-allowed':'Speech recognition is blocked for this browser. Use Chrome and check that Google voice typing is on in your phone settings.','audio-capture':'No microphone found, or another app is using it. Close other apps that use the microphone.','network':'Speech recognition needs an internet connection.','no-speech':'It did not hear anything. Speak closer to the microphone.','language-not-supported':'This language is not supported. Try English (India) or English (US).'})[c]||('Error: '+c)}
function pickMime(){var c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];for(var i=0;i<c.length;i++){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c[i]))return c[i]}catch(e){}}return ''}
var ac=null;
function startMeter(stream){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();an.fftSize=512;src.connect(an);var d=new Uint8Array(an.fftSize),on=true,el=$('#lvl');(function tick(){if(!on)return;an.getByteTimeDomainData(d);var m=0;for(var i=0;i<d.length;i++)m=Math.max(m,Math.abs(d[i]-128));if(el)el.style.width=Math.min(100,m/128*160)+'%';requestAnimationFrame(tick)})();return function(){on=false;if(el)el.style.width='0'}}catch(e){return function(){}}}
function liveBox(){var b=$('#live');if(b)b.innerHTML=(esc(T.final)+(T.interim?' <i>'+esc(T.interim)+'</i>':''))||'<i>Listening… speak now.</i>'}
function tickTimer(){if(!T.on)return;var t=$('#timer');if(t){var s=Math.round((Date.now()-T.start)/1000);t.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2)}setTimeout(tickTimer,500)}
function startTalk(){
  if(T.on)return;
  T={on:true,final:'',interim:'',start:Date.now(),stamps:[],err:'',stop:false,sr:null,mr:null,chunks:[],stream:null,stopMeter:null,mime:pickMime()};
  V.res=null;render();
  if(!SR){T.on=false;V.typed=true;toast('Voice typing is not supported in this browser. Use Chrome, or type your answer.');render();return}
  function boot(){
    var r=new SR();T.sr=r;r.lang=S.lang;r.continuous=true;r.interimResults=true;
    r.onresult=function(e){T.stamps.push(Date.now());var f='',i2='';for(var i=e.resultIndex;i<e.results.length;i++){var x=e.results[i];if(x.isFinal)f+=x[0].transcript+' ';else i2+=x[0].transcript}T.final+=f;T.interim=i2;liveBox()};
    r.onerror=function(e){T.err=e.error};
    r.onend=function(){if(T.on&&!T.stop&&!T.err){try{boot();return}catch(x){}}finishTalk()};
    try{r.start()}catch(x){T.err='start-failed';finishTalk()}
  }
  boot();tickTimer();
  setTimeout(function(){
    if(!T.on||!alsoRec()||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return;
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      if(!T.on){stream.getTracks().forEach(function(t){t.stop()});return}
      T.stream=stream;try{T.mr=T.mime?new MediaRecorder(stream,{mimeType:T.mime}):new MediaRecorder(stream);T.mr.ondataavailable=function(e){if(e.data&&e.data.size)T.chunks.push(e.data)};T.mr.start();T.stopMeter=startMeter(stream)}catch(x){T.mr=null}
    }).catch(function(){});
  },350);
}
function stopTalk(){if(!T.on)return;T.stop=true;try{T.sr&&T.sr.stop()}catch(e){}setTimeout(function(){if(T.on)finishTalk()},900)}
function finishTalk(){
  if(!T.on)return;T.on=false;
  try{if(T.mr&&T.mr.state==='recording')T.mr.stop()}catch(e){}
  if(T.stopMeter)T.stopMeter();
  setTimeout(function(){
    if(T.stream)T.stream.getTracks().forEach(function(t){t.stop()});
    var text=(T.final+' '+T.interim).trim(),secs=(Date.now()-T.start)/1000,url=null;
    if(T.chunks.length){var blob=new Blob(T.chunks,{type:T.mime||'audio/webm'});if(blob.size>1500)url=URL.createObjectURL(blob)}
    if(!text){V.res={err:(T.err?explain(T.err):explain('no-speech'))+(alsoRec()&&isMobile()?' On many phones the microphone can only be used by one thing at a time. Turn off "Also record my voice" and try again.':''),url:url};render();return}
    var a=analyse(text,secs,T.stamps);
    V.res={text:text,a:a,url:url,note:T.err&&T.err!=='aborted'?explain(T.err):''};saveSession(null);render();
  },350);
}
function saveSession(rating){
  var r=V.res,p=V.prompt;if(!r||!r.a||r.saved)return;
  S.sessions.unshift({id:Date.now(),n:dayIdx(),pid:p.id,q:p.q,text:r.text,secs:r.a.secs,words:r.a.words,wpm:r.a.wpm,fill:r.a.fill.length,fillRate:+r.a.fillRate.toFixed(1),longest:+r.a.longest.toFixed(1),rating:rating||null});
  S.sessions=S.sessions.slice(0,200);if(S.days.indexOf(dayIdx())<0)S.days.push(dayIdx());r.saved=true;save();
}
/* ---------- views ---------- */
var ICON={today:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/>',practice:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',progress:'<path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/>',jobs:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',talk:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'};
var TABS=[['today','Today'],['jobs','Interview'],['talk','Talk'],['practice','Speak'],['progress','Progress']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'"'+(V.tab===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[t[0]]+'</svg>'+t[1]+'</button>'}).join('')}
function streak(){var n=dayIdx(),c=0;if(S.days.indexOf(n)<0)n--;while(S.days.indexOf(n)>=0){c++;n--}return c}
function dayLabel(n){var d=dayIdx()-n;return d<=0?'Today':d===1?'Yesterday':d+' days ago'}
function doneToday(pid){return S.sessions.some(function(s){return s.n===dayIdx()&&s.pid===pid})}
function fmt12(t){var p=t.split(':'),h=+p[0];return (h%12||12)+':'+p[1]+' '+(h<12?'am':'pm')}
var TIMES=[['07:30','Early morning'],['08:30','Before work'],['13:00','Lunch break'],['19:30','Evening']];
function vNudge(){
  if(!S.remind)return '<div class="card" style="border-color:var(--win)"><span class="eyebrow" style="color:var(--win)">Best time to practise</span><b>Pick a time you will keep</b><p class="muted small">A habit sticks when it follows something you already do. For most people the best slot is the morning, about 15 minutes before the first meeting.</p><div class="row wrap">'+TIMES.map(function(t){return '<button class="pill" data-time="'+t[0]+'">'+fmt12(t[0])+' · '+t[1]+'</button>'}).join('')+'</div></div>';
  var n=new Date(),nm=n.getHours()*60+n.getMinutes(),p=S.remind.split(':'),tm=+p[0]*60+ +p[1],done=doneToday('tmay')&&doneToday(todayStarter().id);
  if(done)return '<div class="card" style="background:var(--good-soft);border-color:transparent"><b>Done for today.</b><span class="muted small">Next practice: tomorrow at '+fmt12(S.remind)+'.</span></div>';
  if(nm>=tm)return '<div class="card" style="border-color:var(--accent);background:var(--soft)"><span class="eyebrow">It is your practice time</span><b>Your 10 minutes are ready</b></div>';
  var d=tm-nm;return '<div class="card"><span class="eyebrow">Your practice time</span><b>'+fmt12(S.remind)+', in '+(d>=60?Math.floor(d/60)+' h '+(d%60)+' min':d+' min')+'</b></div>';
}
function vToday(){
  var st=todayStarter(),s=streak();
  var h=vNudge();
  h+='<div class="card" style="border-color:var(--accent)"><div class="row between"><span class="eyebrow">Today\'s practice</span><span class="pill">'+esc(label())+(S.profile&&S.profile.goal?' · '+esc(S.profile.goal):'')+'</span></div><h2>Say it out loud</h2><p class="muted small">Two answers, about 5 minutes each. Speak, then see your pace, fillers and pauses.</p>'+
   '<div class="stepgrid">'+[[TMAY,'Most asked question'],[st,'Starter prompt']].map(function(x){var p=x[0];return '<div class="step"><span class="dot'+(doneToday(p.id)?' on':'')+'">'+(doneToday(p.id)?'✓':'')+'</span><div style="flex:1"><span class="eyebrow">'+x[1]+'</span><b style="display:block">'+esc(p.q)+'</b><button class="btn'+(doneToday(p.id)?' quiet':'')+'" style="margin-top:8px" data-go="'+p.id+'">'+(doneToday(p.id)?'Practise again':'Speak now')+'</button></div></div>'}).join('')+'</div></div>';
  h+='<div class="card"><div class="row between"><div><b>'+(S.sessions.length?S.sessions.length+' session'+(S.sessions.length>1?'s':'')+' so far':'No sessions yet')+'</b><div class="muted small">'+(s?s+'-day streak':'Practise today to start a streak')+'</div></div><button class="btn quiet" data-tab="progress">Progress</button></div></div>';
  h+='<div class="card"><span class="eyebrow">Coming next</span><ul class="muted small" style="margin:0;padding-left:18px"><li>Sign in, so progress follows you</li><li>Role-specific questions from your resume</li><li>AI interviewer that listens and gives feedback on what you said</li></ul></div>';
  return h;
}
function promptById(id){if(id==='tmay')return TMAY;var all=[].concat.apply([],Object.keys(STARTERS).map(function(k){return STARTERS[k]}));var f=all.filter(function(x){return x.id===id})[0];return f||todayStarter()}
function vSpeak(){
  var p=V.prompt,r=V.res,h='<button class="btn quiet" data-act="back" style="align-self:flex-start">Back</button>';
  h+='<div class="card" style="border-color:var(--accent)"><span class="eyebrow">'+(p.star?'Most asked question':'Practice prompt')+'</span><h2>'+esc(p.q)+'</h2>'+(p.hint?'<div class="hint">'+esc(p.hint)+'</div>':'')+'</div>';
  if(!r){
    h+='<div class="card"><label for="lang">Language</label><select id="lang"><option value="en-IN">English (India)</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="hi-IN">Hindi</option><option value="te-IN">Telugu</option></select>'+
     '<label class="row" style="font-weight:600;font-size:15px;margin:0"><input type="checkbox" id="alsoRec" style="width:20px;height:20px"'+(alsoRec()?' checked':'')+(T.on?' disabled':'')+'> Also record my voice</label><p class="small muted">'+(isMobile()?'On most phones, words appear best with this off. Turn it on only to hear yourself back.':'Lets you play your answer back afterwards.')+'</p>'+'<button class="btn big'+(T.on?' rec':'')+'" data-act="'+(T.on?'stop':'start')+'">'+(T.on?'Stop':'Start speaking')+'</button>'+
     (T.on?'<div class="row between"><b id="timer">0:00</b><span class="muted small">'+(p.target?'Aim for about '+p.target+' seconds':'Speak naturally')+'</span></div><div class="meter" aria-hidden="true"><div id="lvl"></div></div>':'')+
     '<div class="box" id="live"><i>'+(T.on?'Listening… speak now.':'Your words appear here as you speak.')+'</i></div>'+
     '<button class="btn quiet" data-act="typed">'+(V.typed?'Hide typing box':'Type instead')+'</button>'+
     (V.typed?'<textarea id="typed" rows="5" placeholder="Type your answer here"></textarea><button class="btn block" data-act="analyseTyped">See word and filler analysis</button>':'')+'</div>';
  }else if(r.err){
    h+='<div class="card"><div class="msg no"><b>Did not work.</b> '+esc(r.err)+'</div>'+(r.url?'<audio controls src="'+r.url+'"></audio>':'')+'<button class="btn block" data-act="again">Try again</button><button class="btn quiet" data-act="typed2">Type your answer instead</button></div>';
  }else{
    var a=r.a;
    h+='<div class="card"><h2>Your result</h2><div class="grid"><div class="stat"><span class="muted small">Time</span><b>'+(a.secs?Math.floor(a.secs/60)+':'+('0'+a.secs%60).slice(-2):'n/a')+'</b></div><div class="stat"><span class="muted small">Words</span><b>'+a.words+'</b></div><div class="stat"><span class="muted small">Pace</span><b>'+(a.wpm?a.wpm+' / min':'n/a')+'</b></div><div class="stat"><span class="muted small">Filler words</span><b>'+a.fill.length+'</b></div></div>'+
     (a.fill.length?'<p class="small muted">Heard: '+esc(a.fill.slice(0,8).join(', '))+'</p>':'')+
     tips(a,p.target).map(function(t){return '<div><span class="pill '+t[0]+'">'+({good:'Good',warn:'Improve',win:'Note'}[t[0]])+'</span> '+esc(t[1])+'</div>'}).join('')+
     '<p class="small muted">Pauses and pace are estimates from when words arrived. Feedback on what you said arrives with the AI step.</p></div>';
    if(r.url)h+='<div class="card"><h3>Hear yourself</h3><audio controls src="'+r.url+'"></audio></div>';
    else h+='<div class="card"><p class="muted small">'+(alsoRec()?'No recording was made while it was listening. That is a phone limit, not a problem with your answer.':'Recording was off, so the phone could listen for your words. Turn on "Also record my voice" to hear yourself, but on some phones the words may then stop appearing.')+'</p></div>';
    h+='<div class="card"><h3>Your words</h3><div class="box" style="font-size:16px;min-height:0">'+esc(r.text)+'</div>'+(r.note?'<p class="small" style="color:var(--warn)">'+esc(r.note)+'</p>':'')+'</div>';
    h+='<div class="card"><label>How confident did you feel? (1 low, 5 high)</label><div class="seg" id="rate">'+[1,2,3,4,5].map(function(n){return '<button data-rate="'+n+'" aria-pressed="'+(r.rating===n)+'">'+n+'</button>'}).join('')+'</div><div class="row wrap"><button class="btn" data-act="again">Practise again</button><button class="btn quiet" data-act="back">Done</button></div></div>';
  }
  return h;
}
function soon(step,title,text){return '<div class="card" style="opacity:.92"><div class="row between"><b>'+title+'</b><span class="pill win">Step '+step+'</span></div><p class="muted small">'+text+'</p></div>'}
function vJobs(){
  return '<div><span class="eyebrow">Interview</span><h2>Get ready for the interview</h2><p class="muted small">These need the AI server, so they arrive in the next steps. Until then, practise out loud in the Speak tab.</p></div>'+
   soon(3,'Tell me about yourself','Answer a few short questions and get a tailored 30 and 60 second answer, then rehearse it with an interviewer.')+
   soon(3,'Search by job role','Type a role and get technical, situational and business questions, with how to answer each.')+
   soon(5,'Match my resume','Two buttons: prepare interview questions from your resume, or analyse and build an ATS-friendly resume as a Word file.');
}
function vTalk(){
  return '<div><span class="eyebrow">Talk</span><h2>Practise a conversation</h2><p class="muted small">An AI partner that talks back arrives in Step 4.</p></div>'+
   soon(4,'AI conversation partner','Practise client calls, asking for a raise, saying no, giving feedback, or your own situation. It answers back and gets harder if you stay vague.')+
   soon(4,'Feedback on what you said','Scores, what worked, what to improve, a stronger version of each answer, and word upgrades.');
}
function vPractice(){
  var h='<div><span class="eyebrow">Speak</span><h2>Practise out loud</h2><p class="muted small">Pick a prompt, tap Start and talk. You get your pace, filler words and a recording to listen back to.</p></div>';
  var all=[TMAY].concat(STARTERS[S.profile?S.profile.type:'professional']);
  h+=all.map(function(p){return '<button class="scn" data-go="'+p.id+'"'+(p.star?' style="border-color:var(--accent)"':'')+'><span class="avatar">'+(p.star?'?':'•')+'</span><span>'+(p.star?'<span class="pill win" style="margin-bottom:4px">Most asked</span><br>':'')+'<b>'+esc(p.q)+'</b>'+(doneToday(p.id)?'<br><span class="small" style="color:var(--good)">Done today</span>':'')+'</span></button>'}).join('');
  h+='<div class="card"><h3>Your own question</h3><label for="own">Type or paste any question</label><textarea id="own" rows="2" placeholder="For example: Why should we hire you for this role?"></textarea><button class="btn block" data-act="own">Practise this question</button></div>';
  return h;
}
function vProgress(){
  var ss=S.sessions,n=ss.length,h='<div class="card"><h2>Your progress</h2>';
  if(!n)h+='<p class="muted">Finish a practice and your progress appears here.</p>';
  else{
    var last=ss.slice(0,10).reverse(),rated=ss.filter(function(s){return s.rating});
    h+='<div class="grid"><div class="stat"><span class="muted small">Sessions</span><b>'+n+'</b></div><div class="stat"><span class="muted small">Days practised</span><b>'+S.days.length+'</b></div><div class="stat"><span class="muted small">Avg pace</span><b>'+Math.round(mean(ss.filter(function(s){return s.wpm}).map(function(s){return s.wpm})))+'</b></div><div class="stat"><span class="muted small">Fillers per 100 words</span><b>'+mean(ss.map(function(s){return s.fillRate})).toFixed(1)+'</b></div></div>';
    if(rated.length)h+='<p class="small muted">Your own confidence rating: '+mean(rated.map(function(s){return s.rating})).toFixed(1)+' out of 5 on average.</p>';
    if(last.length>1)h+='<div><span class="eyebrow">Filler words per 100 words, oldest to newest</span><div class="row wrap" style="gap:6px;margin-top:6px">'+last.map(function(s){return '<span class="pill '+(s.fillRate>4?'warn':'good')+'">'+s.fillRate+'</span>'}).join('')+'</div></div>';
  }
  h+='</div>';
  h+='<div class="card"><h3>Recent sessions</h3>'+(n?ss.slice(0,12).map(function(s){return '<details class="entry"><summary><b>'+esc(s.q.length>70?s.q.slice(0,67)+'…':s.q)+'</b><div class="muted small">'+dayLabel(s.n)+' · '+s.secs+' sec · '+s.wpm+' wpm · '+s.fill+' fillers</div></summary><p class="small" style="margin-top:6px">'+esc(s.text)+'</p></details>'}).join(''):'<p class="muted small">No sessions yet.</p>')+'</div>';
  h+='<div class="card"><span class="eyebrow">Settings</span><b>'+esc(label())+(S.profile&&S.profile.goal?' · '+esc(S.profile.goal):'')+'</b><div class="row wrap"><button class="btn quiet" data-act="switch">Change profile</button></div>'+
   '<div><label>Best time to practise</label><div class="row wrap">'+TIMES.map(function(t){return '<button class="pill'+(S.remind===t[0]?' win':'')+'" data-time="'+t[0]+'">'+fmt12(t[0])+'</button>'}).join('')+'</div></div>'+
   '<p class="small muted">Everything is saved on this device only for now. Recordings are never saved; they stay in this page until you close it.</p><button class="btn ghost" data-act="wipe">'+(V.confirmWipe?'Tap again to delete everything':'Delete all my data')+'</button></div>';
  return h;
}
function onbValid(){return !!(V.pt&&V.pg&&(V.pt!=='other'||V.pspec.trim())&&(V.pg!=='Other'||V.pgs.trim()))}
function vOnboard(){
  var h=(S.profile?'<button class="btn quiet" data-act="cancelOnb" style="align-self:flex-start">Back</button>':'')+'<div><span class="eyebrow">Welcome to Steady</span><h1>Who are you?</h1><p class="muted">This tunes your practice prompts. You can change it any time.</p></div>';
  h+=Object.keys(PROFILES).map(function(k){var p=PROFILES[k],on=V.pt===k;return '<button class="scn" data-pt="'+k+'" style="'+(on?'border-color:var(--accent);background:var(--soft)':'')+'"><span class="avatar">'+p.label.charAt(0)+'</span><span><b>'+p.label+'</b><br><span class="muted small">'+p.blurb+'</span></span></button>'}).join('');
  if(V.pt==='other')h+='<div class="card"><label for="pspec">Tell us in a few words who you are</label><input type="text" id="pspec" maxlength="60" value="'+esc(V.pspec)+'" placeholder="Freelance designer, job seeker..."></div>';
  if(V.pt)h+='<div class="card"><h3>What matters most right now?</h3><div class="row wrap">'+PROFILES[V.pt].goals.concat(['Other']).map(function(g){var on=V.pg===g;return '<button class="pill" data-pg="'+esc(g)+'" style="padding:8px 14px;font-size:14px;'+(on?'background:var(--accent);color:var(--accent-ink)':'')+'">'+esc(g)+'</button>'}).join('')+'</div>'+(V.pg==='Other'?'<div><label for="pgs">What do you want to improve? (a few words)</label><input type="text" id="pgs" maxlength="60" value="'+esc(V.pgs)+'"></div>':'')+'<button class="btn block" id="finishBtn" data-act="finish"'+(onbValid()?'':' disabled')+'>'+(S.profile?'Update':'Start practising')+'</button></div>';
  return h;
}
function layout(){
  var m=$('#main'),k=m.children,i;
  $('#app').classList.toggle('nonav',!(S.profile&&!V.onb));
  if(!S.profile||V.onb){for(i=0;i<k.length;i++)if(k[i].classList.contains('card'))k[i].classList.add('wide');return}
  if(V.view==='speak'){if(k[1])k[1].classList.add('wide');for(i=0;i<k.length;i++){if(k[i].querySelector&&k[i].querySelector('#live'))k[i].classList.add('wide')}return}
  if(V.tab==='today'){for(i=0;i<Math.min(2,k.length);i++)k[i].classList.add('wide');return}
  if(V.tab==='practice'&&k.length)k[k.length-1].classList.add('wide');
}
function render(){
  $('#profBtn').textContent=S.profile?label()+' ▾':'Who are you?';
  $('#tabs').style.display=(S.profile&&!V.onb)?'':'none';
  var m=$('#main'),h;
  if(!S.profile||V.onb)h=vOnboard();
  else if(V.view==='speak'&&V.prompt)h=vSpeak();
  else h={today:vToday,jobs:vJobs,talk:vTalk,practice:vPractice,progress:vProgress}[V.tab]();
  var y=m.scrollTop;m.innerHTML=h;layout();
  var sel=$('#lang');if(sel)sel.value=S.lang;
  renderTabs();applyLook();
}
/* ---------- events ---------- */
function openSwitch(){V.onb=true;if(S.profile){V.pt=S.profile.type;V.pspec=S.profile.spec||'';var g=PROFILES[V.pt].goals;if(g.indexOf(S.profile.goal)>=0){V.pg=S.profile.goal;V.pgs=''}else{V.pg='Other';V.pgs=S.profile.goal||''}}render();$('#main').scrollTop=0}
function goPrompt(p){V.prompt=p;V.view='speak';V.res=null;V.typed=false;V.tab='practice';render();$('#main').scrollTop=0}
document.addEventListener('click',function(e){
  var hb=e.target.closest('#profBtn,#modeBtn');
  if(hb){if(hb.id==='profBtn')openSwitch();else{S.mode=isDark()?'light':'dark';save();applyLook()}return}
  var t=e.target.closest('button');if(!t)return;
  var d=t.dataset;
  if(d.tab){if(T.on)return;V.tab=d.tab;V.view=null;render();$('#main').scrollTop=0;return}
  if(d.pt){V.pt=d.pt;V.pg=null;V.pgs='';render();return}
  if(d.pg){V.pg=d.pg;render();return}
  if(d.time){S.remind=d.time;save();render();toast('Practice time saved');return}
  if(d.go){goPrompt(promptById(d.go));return}
  if(d.rate){var n=+d.rate;if(V.res){V.res.rating=n;saveSession(n);if(S.sessions[0]&&V.res.saved)S.sessions[0].rating=n;save();render()}return}
  var a=d.act;if(!a)return;
  if(a==='finish'){if(!onbValid())return;S.profile={type:V.pt,spec:V.pt==='other'?V.pspec.trim():'',goal:V.pg==='Other'?V.pgs.trim():V.pg};V.onb=false;V.tab='today';save();render()}
  else if(a==='cancelOnb'){V.onb=false;render()}
  else if(a==='switch')openSwitch();
  else if(a==='back'){if(T.on)return;if(V.res&&V.res.a&&!V.res.saved)saveSession(V.res.rating);V.view=null;V.res=null;render()}
  else if(a==='start')startTalk();
  else if(a==='stop')stopTalk();
  else if(a==='again'){if(V.res&&V.res.a&&!V.res.saved)saveSession(V.res.rating);V.res=null;render()}
  else if(a==='typed'){V.typed=!V.typed;render()}
  else if(a==='typed2'){V.res=null;V.typed=true;render()}
  else if(a==='analyseTyped'){var tx=($('#typed').value||'').trim();if(tx.split(/\s+/).length<5){toast('Type a few sentences first.');return}V.res={text:tx,a:analyse(tx,0,[]),url:null,note:'Typed answer: pace and pauses are not measured.'};saveSession(null);render()}
  else if(a==='own'){var q=($('#own').value||'').trim();if(q.length<8){toast('Type the question first.');return}goPrompt({id:'own',q:q,hint:'',target:0})}
  else if(a==='wipe'){if(V.confirmWipe){try{localStorage.removeItem(KEY)}catch(x){}S={profile:null,target:'',sessions:[],days:[],mode:'auto',remind:null,lang:'en-IN'};V.confirmWipe=false;V.onb=false;V.pt=null;V.pg=null;toast('All data deleted');render()}else{V.confirmWipe=true;render()}}
});
document.addEventListener('input',function(e){var id=e.target.id;if(id==='pspec'){V.pspec=e.target.value;var b=$('#finishBtn');if(b)b.disabled=!onbValid()}else if(id==='pgs'){V.pgs=e.target.value;var b2=$('#finishBtn');if(b2)b2.disabled=!onbValid()}});
document.addEventListener('change',function(e){if(e.target.id==='lang'){S.lang=e.target.value;save()}if(e.target.id==='alsoRec'){S.alsoRec=e.target.checked;save()}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook)}catch(e){}
render();
</script>
</body>
</html>

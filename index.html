<!DOCTYPE html>
<html lang="en">
<head>

<title>Steady</title>
<style>
/* Layout: one phone-width column, bottom tabs, one primary action per screen. Step 1: voice practice, saved on this device. */
:root{--bg:#F3F5F7;--surface:#FFFFFF;--ink:#13232B;--muted:#5B6B73;--line:#D8E0E1;--accent:#0F5E63;--accent-ink:#FFFFFF;--soft:#E3F0F0;--win:#B07508;--win-soft:#FBEFD5;--warn:#B4441A;--warn-soft:#FBE6DC;--good:#17803D;--good-soft:#DDF3E4;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0D171B;--surface:#16252B;--ink:#E7F0F0;--muted:#97A9AF;--line:#27393F;--accent:#5BB5B5;--accent-ink:#062022;--soft:#173538;--win:#F0B44C;--win-soft:#3A2E14;--warn:#F08A5D;--warn-soft:#3B2217;--good:#58C77F;--good-soft:#163524}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0D171B;--surface:#16252B;--ink:#E7F0F0;--muted:#97A9AF;--line:#27393F;--accent:#5BB5B5;--accent-ink:#062022;--soft:#173538;--win:#F0B44C;--win-soft:#3A2E14;--warn:#F08A5D;--warn-soft:#3B2217;--good:#58C77F;--good-soft:#163524}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}p{margin:0}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.hdr{display:flex;gap:8px;align-items:center}
main{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.quiet{background:var(--soft);color:var(--accent)}.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.block{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:20px;min-height:68px;border-radius:18px}.btn.rec{background:var(--warn);color:#fff}
.signin{width:100%;max-width:440px;margin:18px auto 0;display:flex;flex-direction:column;gap:18px;text-align:center;align-items:center}
.signin .sl,.signin .sr{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}.signin .srh{display:none}
@media (min-width:900px){.signin{max-width:1080px;flex-direction:row;align-items:center;gap:64px;margin-top:40px;text-align:left}.signin .sl{flex:1.15;align-items:flex-start}.signin .sl h1{font-size:40px}.signin .sr{flex:1;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:36px;gap:14px;text-align:center}.signin .srh{display:block;font-size:22px;margin:0}}
.signin .mark{width:68px;height:68px;border-radius:20px;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(15,94,99,.25)}
.signin h1{font-size:30px}
.perks{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.perk{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.perk .pd{flex:none;width:26px;height:26px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;font-weight:800;font-size:14px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;min-height:54px;border-radius:14px;border:1.5px solid #dadce0;background:#fff;color:#1f1f1f;font-weight:700;font-size:17px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gbtn:hover{background:#f8f9fa}.gbtn:disabled{opacity:.7;cursor:wait}.gbtn svg{width:22px;height:22px;flex:none}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;padding:10px;min-height:44px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid #dadce0;border-top-color:#4285F4;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--accent);border:0}
button.pill{cursor:pointer;padding:7px 12px;font-size:13px}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.win{background:var(--win-soft);color:var(--win)}
.ic{padding:8px 10px}
#profBtn{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label{font-weight:700;font-size:13px;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px}textarea{resize:vertical}
.scn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;width:100%}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800}
.dot.on{background:var(--good);border-color:var(--good);color:#fff}
.box{min-height:110px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;font-size:18px;line-height:1.5;overflow-wrap:anywhere}
.box i{color:var(--muted);font-style:normal}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.meter div{height:100%;width:0;background:var(--accent);transition:width .08s}
.hint{background:var(--win-soft);border-left:4px solid var(--win);border-radius:12px;padding:10px 12px;font-size:14px}
.msg{border-radius:12px;padding:10px 12px;font-size:14px}.msg.no{background:var(--warn-soft);color:var(--warn)}.msg.ok{background:var(--good-soft);color:var(--good)}.msg.wait{background:var(--win-soft);color:var(--win)}
audio{width:100%}
.entry{padding:10px 0;border-top:1px solid var(--line)}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
.big-n{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;display:none;max-width:90%;text-align:center}
.toast.on{display:block}

/* Wider screens only. The phone layout above is unchanged. */
.wide{}
@media (min-width:700px){
  .app{max-width:860px}
  main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start;padding:16px 24px 28px}
  main>div:not(.card),main>button.btn,main>.wide{grid-column:1/-1}
  main>button.btn{justify-self:start}
  .stepgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .stepgrid .step{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
}
@media (min-width:1000px){
  html,body{background:var(--bg)}
  .app{max-width:none;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "nav main"}
  .app.nonav{grid-template-columns:1fr;grid-template-areas:"head" "main"}
  header{grid-area:head;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
  nav{grid-area:nav;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 12px;gap:4px;align-self:stretch}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px}
  nav button svg{width:20px;height:20px}
  nav button[aria-current="page"]{background:var(--soft)}
  nav button:hover{background:var(--soft)}
  main{grid-area:main;padding:24px 36px 40px;gap:18px}
  main>*{max-width:none}
  .inner{max-width:1180px}
  .toast{bottom:24px}
  .btn.big{max-width:420px}
}
@media (min-width:1500px){
  main{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stepgrid{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 14h3l3-8 4 12 3-7h3"/></svg></span>Steady</div>
    <div class="hdr"><button class="pill" id="profBtn" aria-label="Switch profile"></button><button class="pill ic" id="colBtn" aria-label="Change colour"></button><button class="pill ic" id="modeBtn" aria-label="Switch between light and dark"></button></div>

</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
'use strict';
var KEY='steady.v1';
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function dayIdx(){return Math.floor((Date.now()+19800000)/864e5)}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2600)}
/* ---------- data (saved on this device) ---------- */
var S={profile:null,target:'',sessions:[],days:[],mode:'auto',remind:null,lang:'en-IN',vocab:[],fixes:{},guest:false,resume:null};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device.')}cloudSave()}
/* ---------- account and cloud saving (Firebase) ---------- */
var firebaseConfig={apiKey:"AIzaSyDpvS27o9i8NHYbCGB-YuLEyhDYa94bVdQ",authDomain:"studyprephub.firebaseapp.com",projectId:"studyprephub",storageBucket:"studyprephub.firebasestorage.app",messagingSenderId:"578977296879",appId:"1:578977296879:web:44eebdb0623f0e533a461a"};
var FB={ok:false,ready:false,user:null,auth:null,db:null,timer:null,saving:false,again:false,loaded:false,status:''};
var CLOUD_KEYS=['profile','target','sessions','days','mode','remind','lang','vocab','fixes','alsoRec','resume','theme','resumeAsked','bannerOff'];
function gate(){return FB.ok&&(!FB.ready||(!FB.user&&!S.guest))}
function cloudRef(){return FB.db.doc('users/'+FB.user.uid+'/data/app')}
function cloudSave(){
  if(!FB.ok||!FB.user||!FB.loaded)return;
  clearTimeout(FB.timer);FB.timer=setTimeout(cloudFlush,1500);
}
function cloudFlush(){
  if(!FB.ok||!FB.user||!FB.loaded)return;
  if(FB.saving){FB.again=true;return}
  FB.saving=true;FB.again=false;FB.status='saving';
  var o={updatedAt:Date.now()};CLOUD_KEYS.forEach(function(k){if(S[k]!==undefined)o[k]=S[k]});
  o=JSON.parse(JSON.stringify(o));o.sessions=(o.sessions||[]).slice(0,100);o.days=(o.days||[]).slice(-200);
  cloudRef().set(o).then(function(){FB.status='saved'}).catch(function(e){FB.status='error'}).then(function(){FB.saving=false;if(FB.again)cloudFlush();});
}
function softRefresh(){var m=$('#main');if(m&&V.tab==='progress'&&!V.view&&!V.onb)render()}
function mergeCloud(d){
  CLOUD_KEYS.forEach(function(k){if(d[k]===undefined)return;
    if(k==='sessions'){var seen={},all=(d.sessions||[]).concat(S.sessions||[]).filter(function(s){if(seen[s.id])return false;seen[s.id]=1;return true});all.sort(function(a,b){return b.id-a.id});S.sessions=all.slice(0,200)}
    else if(k==='days'){var u={};(d.days||[]).concat(S.days||[]).forEach(function(x){u[x]=1});S.days=Object.keys(u).map(Number).sort(function(a,b){return a-b})}
    else if(k==='fixes'){var f={};for(var a in (S.fixes||{}))f[a]=S.fixes[a];for(var b in d.fixes)f[b]=d.fixes[b];S.fixes=f}
    else if(k==='vocab'){var v={};(d.vocab||[]).concat(S.vocab||[]).forEach(function(x){v[x]=1});S.vocab=Object.keys(v).slice(0,60)}
    else S[k]=d[k];
  });
}
function loadCloud(){
  FB.loaded=false;
  cloudRef().get().then(function(snap){
    if(snap.exists)mergeCloud(snap.data());
    FB.loaded=true;S.guest=false;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    cloudFlush();render();
  }).catch(function(){FB.status='error';FB.loaded=false;toast('Could not reach your account. Working on this device for now.');render()});
}
function initFirebase(){
  if(!window.firebase){FB.status='offline';return}
  try{
    firebase.initializeApp(firebaseConfig);FB.auth=firebase.auth();FB.db=firebase.firestore();FB.ok=true;
    FB.auth.getRedirectResult().catch(function(e){if(e&&e.code!=='auth/no-auth-event')toast('Sign-in did not finish. Please try again.')});
    FB.auth.onAuthStateChanged(function(u){FB.user=u;FB.ready=true;V.signing=false;if(u)loadCloud();else{FB.loaded=false;render()}});
  }catch(e){FB.ok=false;FB.status='error'}
  setTimeout(function(){if(FB.ok&&!FB.ready){FB.ready=true;render()}},6000);
}
function signIn(){
  if(!FB.ok){toast('Sign-in is not available right now.');return}
  if(V.signing)return;
  V.signing=true;if(gate())render();
  var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  function stop(){V.signing=false;render()}
  FB.auth.signInWithPopup(p).then(function(){V.signing=false}).catch(function(e){
    var c=e&&e.code;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){FB.auth.signInWithRedirect(p);return}
    stop();
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
    toast(c==='auth/unauthorized-domain'?'This web address is not allowed in Firebase yet.':c==='auth/network-request-failed'?'No internet connection. Try again.':'Could not sign in. Please try again.');
  });
}
function signOutNow(){
  if(!FB.ok)return;
  try{clearTimeout(FB.timer)}catch(e){}
  FB.auth.signOut().then(function(){try{localStorage.removeItem(KEY)}catch(e){}S={profile:null,target:'',sessions:[],days:[],mode:S.mode,remind:null,lang:'en-IN',vocab:[],fixes:{},guest:false};FB.loaded=false;V.onb=false;V.view=null;V.tab='today';render()});
}
function vSignin(){
  var MARK='<div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 14h3l3-8 4 12 3-7h3"/></svg></div>';
  var G='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
  if(FB.ok&&!FB.ready)return '<div class="signin" style="margin-top:60px"><div class="sl">'+MARK+'<p class="muted">Getting ready…</p></div></div>';
  var perks=[['Practise out loud','Speak, see your pace and filler words, and improve every day.'],['Answers from your own resume','Add your resume if you like. Steady then writes stronger answers using only your real experience.'],['Safe on every device','Your progress follows you to any phone or computer.']];
  return '<div class="signin"><div class="sl">'+MARK+'<div><h1>Speak with confidence</h1><p class="muted" style="margin-top:8px">Practise out loud, get honest feedback, and walk into your next interview or meeting ready.</p></div>'+
   '<div class="perks">'+perks.map(function(x){return '<div class="perk"><span class="pd" aria-hidden="true">✓</span><div><b>'+x[0]+'</b><div class="muted small">'+x[1]+'</div></div></div>'}).join('')+'</div></div>'+
   '<div class="sr"><b class="srh">Sign in to start</b><p class="muted small srh">It takes one tap.</p>'+
   '<button class="gbtn" data-act="signin"'+(V.signing?' disabled':'')+'>'+(V.signing?'<span class="spin" aria-hidden="true"></span>Opening Google…':G+'Continue with Google')+'</button>'+
   (V.signing?'<p class="small muted">A Google window should open. If nothing appears, allow pop-ups for this site and tap again.</p>':'')+
   '<p class="small muted">We only use your name and email to save your progress. Your answers and resume are private to you.</p>'+
   '<button class="linkbtn" data-act="guest">Try it without signing in</button>'+
   '<p class="small muted" style="margin-top:-8px">Without signing in, everything stays on this device and AI features are off.</p><p class="small muted" style="opacity:.7">'+VERSION+'</p></div></div>';
}
var V={tab:'today',view:null,pt:null,pg:null,pspec:'',pgs:'',onb:false,prompt:null,res:null,typed:false};
/* ---------- profiles and practice prompts ---------- */
var PROFILES={
 student:{label:'Student',blurb:'School or college, interviews, presentations',goals:['Interviews','Class presentations','Speaking up in class','Group projects']},
 professional:{label:'Professional',blurb:'Employee, manager or specialist',goals:['Promotion','Meetings and updates','Clients and stakeholders','Giving feedback']},
 business:{label:'Business professional',blurb:'Owner, founder, sales or consultant',goals:['Sales and prospects','Negotiation','Investors and pitching','Handling clients']},
 other:{label:'Other',blurb:'Freelancer, job seeker, homemaker, anything else',goals:['Interviews','Everyday conversations','Public speaking','Confidence']}
};
var TMAY={id:'tmay',q:'Tell me about yourself.',hint:'Present, past, future: who you are now, one or two achievements, and why this role. Aim for about 60 seconds.',target:60,star:true};
var STARTERS={

  h+=Object.keys(PROFILES).map(function(k){var p=PROFILES[k],on=V.pt===k;return '<button class="scn" data-pt="'+k+'" style="'+(on?'border-color:var(--accent);background:var(--soft)':'')+'"><span class="avatar">'+p.label.charAt(0)+'</span><span><b>'+p.label+'</b><br><span class="muted small">'+p.blurb+'</span></span></button>'}).join('');
  if(V.pt==='other')h+='<div class="card"><label for="pspec">Tell us in a few words who you are</label><input type="text" id="pspec" maxlength="60" value="'+esc(V.pspec)+'" placeholder="Freelance designer, job seeker..."></div>';
  if(V.pt)h+='<div class="card"><h3>What matters most right now?</h3><div class="row wrap">'+PROFILES[V.pt].goals.concat(['Other']).map(function(g){var on=V.pg===g;return '<button class="pill" data-pg="'+esc(g)+'" style="padding:8px 14px;font-size:14px;'+(on?'background:var(--accent);color:var(--accent-ink)':'')+'">'+esc(g)+'</button>'}).join('')+'</div>'+(V.pg==='Other'?'<div><label for="pgs">What do you want to improve? (a few words)</label><input type="text" id="pgs" maxlength="60" value="'+esc(V.pgs)+'"></div>':'')+'<button class="btn block" id="finishBtn" data-act="finish"'+(onbValid()?'':' disabled')+'>'+(S.profile?'Update':'Start practising')+'</button></div>';
  return h;
}
function layout(){
  var m=$('#main'),k=m.children,i;
  $('#app').classList.toggle('nonav',!(S.profile&&!V.onb&&!gate()&&!V.resumeStep));
  if(gate()||!S.profile||V.onb||V.resumeStep){for(i=0;i<k.length;i++)if(k[i].classList.contains('card'))k[i].classList.add('wide');return}
  if(V.view==='speak'){if(k[1])k[1].classList.add('wide');for(i=0;i<k.length;i++){if(k[i].querySelector&&k[i].querySelector('#live'))k[i].classList.add('wide')}return}
  if(V.tab==='today'){for(i=0;i<Math.min(2,k.length);i++)k[i].classList.add('wide');return}
  if(V.tab==='practice'&&k.length)k[k.length-1].classList.add('wide');
}
function render(){
  $('#profBtn').textContent=gate()?'Sign in':(S.profile?label()+' ▾':'Who are you?');
  var gated=gate();
  $('#tabs').style.display=(S.profile&&!V.onb&&!gated&&!V.resumeStep)?'':'none';
  var m=$('#main'),h;
  if(gated)h=vSignin();
  else if(!S.profile||V.onb)h=vOnboard();
  else if(V.resumeStep)h=vResumeStep();
  else if(V.view==='speak'&&V.prompt)h=vSpeak();
  else h={today:vToday,jobs:vJobs,talk:vTalk,practice:vPractice,progress:vProgress}[V.tab]();
  var y=m.scrollTop;m.innerHTML=h;layout();
  var sel=$('#lang');if(sel)sel.value=S.lang;
  renderTabs();applyLook();
}
/* ---------- events ---------- */
function openSwitch(){V.onb=true;if(S.profile){V.pt=S.profile.type;V.pspec=S.profile.spec||'';var g=PROFILES[V.pt].goals;if(g.indexOf(S.profile.goal)>=0){V.pg=S.profile.goal;V.pgs=''}else{V.pg='Other';V.pgs=S.profile.goal||''}}render();$('#main').scrollTop=0}
function goPrompt(p){V.prompt=p;V.view='speak';V.res=null;V.typed=false;V.tab='practice';render();$('#main').scrollTop=0}
document.addEventListener('click',function(e){
  var hb=e.target.closest('#profBtn,#modeBtn,#colBtn');
  if(hb){if(hb.id==='colBtn'){var ks=Object.keys(THEMES),ni=(ks.indexOf(S.theme||'teal')+1)%ks.length;S.theme=ks[ni];save();applyLook();render();toast(THEMES[S.theme].n+' colour');return}if(hb.id==='profBtn'){if(gate()){if(FB.ready)signIn()}else openSwitch()}else{S.mode=isDark()?'light':'dark';save();applyLook()}return}
  var t=e.target.closest('button');if(!t)return;
  var d=t.dataset;
  if(d.tab){if(T.on)return;V.tab=d.tab;V.view=null;render();$('#main').scrollTop=0;return}
  if(d.pt){V.pt=d.pt;V.pg=null;V.pgs='';render();return}
  if(d.pg){V.pg=d.pg;render();return}
  if(d.time){S.remind=d.time;save();render();toast('Practice time saved');return}
  if(d.go){goPrompt(promptById(d.go));return}
  if(d.rate){var n=+d.rate;if(V.res){V.res.rating=n;saveSession(n);if(S.sessions[0]&&V.res.saved)S.sessions[0].rating=n;save();render()}return}
  if(d.theme){S.theme=d.theme;save();applyLook();render();return}
  var a=d.act;if(!a)return;
  if(a==='finish'){if(!onbValid())return;S.profile={type:V.pt,spec:V.pt==='other'?V.pspec.trim():'',goal:V.pg==='Other'?V.pgs.trim():V.pg};V.onb=false;V.tab='today';if(!S.resume&&!S.resumeAsked){V.resumeStep=true;V.rs.open=true;V.rs.draft='';V.rs.msg=''}save();render();$('#main').scrollTop=0}
  else if(a==='cancelOnb'){V.onb=false;render()}
  else if(a==='switch')openSwitch();
  else if(a==='back'){if(T.on)return;if(V.res&&V.res.a&&!V.res.saved)saveSession(V.res.rating);V.view=null;V.res=null;render()}
  else if(a==='start')startTalk();
  else if(a==='stop')stopTalk();
  else if(a==='again'){if(V.res&&V.res.a&&!V.res.saved)saveSession(V.res.rating);V.res=null;render()}
  else if(a==='typed'){V.typed=!V.typed;render()}
  else if(a==='typed2'){V.res=null;V.typed=true;render()}
  else if(a==='analyseTyped'){var tx=($('#typed').value||'').trim();if(tx.split(/\s+/).length<5){toast('Type a few sentences first.');return}V.res={text:tx,a:analyse(tx,0,[]),url:null,note:'Typed answer: pace and pauses are not measured.'};saveSession(null);render()}
  else if(a==='own'){var q=($('#own').value||'').trim();if(q.length<8){toast('Type the question first.');return}goPrompt({id:'own',q:q,hint:'',target:0})}
  else if(a==='saveVocab'){var vv=($('#vocab').value||'').split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean),seen={};S.vocab=vv.filter(function(x){var k=x.toLowerCase();if(seen[k])return false;seen[k]=1;return true}).slice(0,60);save();toast('Saved '+S.vocab.length+' word'+(S.vocab.length===1?'':'s'))}
  else if(a==='saveFix'){var el=$('#resText');if(!el||!V.res||!V.res.a)return;var ed=el.innerText.replace(/\s+/g,' ').trim();if(!ed||ed===V.res.text){toast('No changes to save.');return}var nfix=learnFixes(V.res.text,ed);V.res.text=ed;var na=analyse(ed,V.res.a.secs,[]);na.longest=V.res.a.longest;na.longPauses=V.res.a.longPauses;V.res.a=na;var s0=S.sessions.filter(function(s){return s.id===V.res.sid})[0];if(s0){s0.text=ed;s0.words=na.words;s0.wpm=na.wpm;s0.fill=na.fill.length;s0.fillRate=+na.fillRate.toFixed(1)}save();toast(nfix?'Saved. Steady will fix '+nfix+' word'+(nfix>1?'s':'')+' like this next time.':'Text updated.');render()}
  else if(a==='rsEdit'){V.rs.open=true;V.rs.draft=S.resume?S.resume.text:'';V.rs.msg='';render()}
  else if(a==='rsCancel'){V.rs.open=false;V.rs.draft='';V.rs.msg='';render()}
  else if(a==='rsRemove'){S.resume=null;V.rs={open:false,draft:'',busy:false,msg:''};save();render();toast('Resume removed')}
  else if(a==='rsSave'){var dt=tidy(($('#rsText')?$('#rsText').value:V.rs.draft)||'');if(dt.length<80){toast('Paste or upload your full resume first.');return}S.resume={text:dt.slice(0,MAXRES),at:Date.now()};S.resumeAsked=true;V.rs={open:false,draft:'',busy:false,msg:''};if(V.resumeStep){V.resumeStep=false;V.tab='today'}save();render();$('#main').scrollTop=0;toast('Resume saved')}
  else if(a==='rsSkip'){S.resumeAsked=true;V.resumeStep=false;V.rs={open:false,draft:'',busy:false,msg:''};V.tab='today';save();render();$('#main').scrollTop=0}
  else if(a==='rsGoLink'){V.tab='jobs';V.view=null;V.rs.open=true;V.rs.draft='';render();$('#main').scrollTop=0}
  else if(a==='bannerOff'){S.bannerOff=true;save();render()}
  else if(a==='rsGo'){V.tab='jobs';V.view=null;V.rs.open=true;V.rs.draft='';render();$('#main').scrollTop=0}
  else if(a==='copyAns'){var ta=V.res&&V.res.ai?V.res.ai.better_answer:'';if(navigator.clipboard&&ta)navigator.clipboard.writeText(ta).then(function(){toast('Copied')},function(){toast('Could not copy')});else toast('Could not copy')}
  else if(a==='improve'){
    if(V.aiBusy||!V.res||!V.res.text)return;var rr=V.res;V.aiBusy=true;V.aiErr='';render();
    rr.noResume=!S.resume;
    coachCall('improve',{question:V.prompt.q,answer:rr.text,resume:S.resume?S.resume.text.slice(0,MAXAI):'',role:V.aiRole||'',vocab:(S.vocab||[]).slice(0,40),target:V.prompt.target||0})
      .then(function(j){rr.ai=j}).catch(function(err){V.aiErr=aiMsg(err)}).then(function(){V.aiBusy=false;render()});
  }
  else if(a==='signin')signIn();
  else if(a==='guest'){S.guest=true;save();render()}
  else if(a==='signout')signOutNow();
  else if(a==='wipe'){if(V.confirmWipe){if(FB.ok&&FB.user){try{cloudRef().delete()}catch(x){}}try{localStorage.removeItem(KEY)}catch(x){}S={profile:null,target:'',sessions:[],days:[],mode:'auto',remind:null,lang:'en-IN',vocab:[],fixes:{}};V.confirmWipe=false;V.onb=false;V.pt=null;V.pg=null;toast('All data deleted');render()}else{V.confirmWipe=true;render()}}
});
document.addEventListener('input',function(e){var id=e.target.id;if(id==='pspec'){V.pspec=e.target.value;var b=$('#finishBtn');if(b)b.disabled=!onbValid()}else if(id==='pgs'){V.pgs=e.target.value;var b2=$('#finishBtn');if(b2)b2.disabled=!onbValid()}else if(id==='aiRole'){V.aiRole=e.target.value}else if(id==='rsText'){V.rs.draft=e.target.value}});
document.addEventListener('change',function(e){if(e.target.id==='lang'){S.lang=e.target.value;save()}if(e.target.id==='alsoRec'){S.alsoRec=e.target.checked;save()}});
document.addEventListener('change',function(e){
  if(e.target.id!=='rsFile')return;
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  V.rs.busy=true;V.rs.msg='Reading '+f.name+'…';render();
  fileToText(f).then(function(t){t=tidy(t);if(t.length<80)throw new Error('empty');V.rs.draft=t.slice(0,MAXRES);V.rs.open=true;V.rs.msg='Check the text below, fix anything odd, then tap Save resume.'})
    .catch(function(err){V.rs.open=true;V.rs.msg=readErr(err)}).then(function(){V.rs.busy=false;render()});
});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook)}catch(e){}
initFirebase();
render();
</script>
</body>
</html>
